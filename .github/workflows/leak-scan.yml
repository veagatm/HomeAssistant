name: leak-scan
# Server-side backstop for the local pre-commit/pre-push hooks: generic secret
# patterns (tokens, keys, passwords) across the full history on every push.
on: [push, pull_request]
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
