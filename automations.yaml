- id: lr_tv_on_close_blinds
  alias: 'LR: TV On → Close Blinds'
  description: Close both blinds when Roku starts playing during daytime when home.
    Skips the Living Room / Kitchen blind if that room is in Casual mode; lowers to
    50% instead of fully closing if in Chill mode.
  triggers:
  - entity_id: media_player.roku_ultra
    to: playing
    trigger: state
  conditions:
  - condition: state
    entity_id: sun.sun
    state: above_horizon
  - condition: state
    entity_id: input_boolean.away_mode_active
    state: 'off'
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.lighting_mode_living_room
        state: Casual
      sequence: []
    - conditions:
      - condition: state
        entity_id: input_select.lighting_mode_living_room
        state: Chill
      sequence:
      - action: cover.set_cover_position
        target:
          entity_id: cover.living_room_blinds
        data:
          position: 50
    default:
    - action: cover.close_cover
      target:
        entity_id: cover.living_room_blinds
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.lighting_mode_kitchen
        state: Casual
      sequence: []
    - conditions:
      - condition: state
        entity_id: input_select.lighting_mode_kitchen
        state: Chill
      sequence:
      - action: cover.set_cover_position
        target:
          entity_id: cover.kitchen_blinds
        data:
          position: 50
    default:
    - action: cover.close_cover
      target:
        entity_id: cover.kitchen_blinds
  mode: single
- id: lr_tv_off_open_blinds
  alias: 'LR: TV Off → Open Blinds'
