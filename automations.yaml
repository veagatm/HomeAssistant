- id: '1783438136966'
  alias: 'Floodlight: Night Baseline On'
  description: Dim warm-white baseline at sunset so the yard has passive illumination;
    escalation automations brighten on top of this. Porch light gets the same baseline
    only if it wasn't already on (won't override a manual setting).
  triggers:
  - trigger: sun
    event: sunset
  conditions:
  - condition: state
    entity_id: input_boolean.camera_automations_enabled
    state: 'on'
  actions:
  - action: light.turn_on
    target:
      entity_id: light.front_yard_floodlight_floodlight
    data:
      brightness_pct: 15
      color_temp_kelvin: 4000
  - if:
    - condition: state
      entity_id: light.porch
      state: 'off'
    then:
    - action: light.turn_on
      target:
        entity_id: light.porch
      data:
        brightness_pct: 15
  mode: single
- id: '1783438143342'
  alias: 'Floodlight: Night Baseline Off'
  description: Turn off the floodlight at sunrise — daytime doesn't need the dim baseline.
    Also turns off the porch light.
  triggers:
  - trigger: sun
    event: sunrise
  conditions:
  - condition: state
    entity_id: input_boolean.camera_automations_enabled
    state: 'on'
  actions:
  - action: light.turn_off
    target:
      entity_id: light.front_yard_floodlight_floodlight
  - action: light.turn_off
    target:
      entity_id: light.porch
  mode: single
- id: '1783438153394'
  alias: 'Floodlight+Porch: Welcome Known Person Light'
  description: Warm, moderate-brightness welcome light when Riley or Casey is recognized
    in the yard/driveway. Restarts its own timer on repeated sightings; restores to
    night baseline (or off) after 5 min of no further detection.
  triggers:
  - trigger: mqtt
    topic: frigate/events
  conditions:
  - condition: template
    value_template: '{{ trigger.payload_json is not none and trigger.payload_json.type
      in [''update'', ''end''] and trigger.payload_json.after.camera == ''front_floodlight''
      and trigger.payload_json.after.label == ''person'' and trigger.payload_json.after.sub_label
      in [''Riley'', ''Casey''] and (''yard_zone'' in (trigger.payload_json.after.current_zones
      | default([])) or ''driveway_zone'' in (trigger.payload_json.after.current_zones
      | default([]))) }}'
  - condition: state
    entity_id: input_boolean.camera_automations_enabled
    state: 'on'
  - condition: sun
    after: sunset
    before: sunrise
  actions:
  - action: light.turn_on
    target:
      entity_id:
      - light.front_yard_floodlight_floodlight
      - light.porch
    data:
      brightness_pct: 60
      color_temp_kelvin: 3000
  - delay: 00:05:00
  - action: script.floodlight_restore_baseline
  mode: restart
- id: '1783438163614'
  alias: 'Floodlight+Porch: Unknown Person Light'
  description: Bright, cool-white light (floodlight + porch) when an unrecognized
    person is in the yard/driveway. Restarts on repeated sightings; restores to night
    baseline (or off) after 5 min of no further detection.
  triggers:
  - trigger: mqtt
    topic: frigate/events
  conditions:
  - condition: template
    value_template: '{{ trigger.payload_json is not none and trigger.payload_json.type
      in [''update'', ''end''] and trigger.payload_json.after.camera == ''front_floodlight''
      and trigger.payload_json.after.label == ''person'' and trigger.payload_json.after.sub_label
      is none and (''yard_zone'' in (trigger.payload_json.after.current_zones | default([]))
      or ''driveway_zone'' in (trigger.payload_json.after.current_zones | default([])))
      }}'
  - condition: state
    entity_id: input_boolean.camera_automations_enabled
    state: 'on'
  - condition: sun
    after: sunset
    before: sunrise
  actions:
  - action: light.turn_on
    target:
      entity_id:
      - light.front_yard_floodlight_floodlight
      - light.porch
    data:
      brightness_pct: 100
      color_temp_kelvin: 6000
  - delay: 00:05:00
  - action: script.floodlight_restore_baseline
  mode: restart
- id: '1783438172007'
  alias: 'Floodlight: Unknown Person Alert'
  description: Phone notification with snapshot when an unrecognized person's tracked
    event ends in the yard/driveway.
  triggers:
  - trigger: mqtt
    topic: frigate/events
  conditions:
  - condition: template
    value_template: '{{ trigger.payload_json is not none and trigger.payload_json.type
      == ''end'' and trigger.payload_json.after.camera == ''front_floodlight'' and
      trigger.payload_json.after.label == ''person'' and trigger.payload_json.after.sub_label
      is none and (''yard_zone'' in (trigger.payload_json.after.current_zones | default([]))
      or ''driveway_zone'' in (trigger.payload_json.after.current_zones | default([])))
      }}'
  - condition: state
    entity_id: input_boolean.camera_automations_enabled
    state: 'on'
  - condition: not
    conditions:
    - condition: state
      entity_id: input_boolean.door_recently_opened_front
      state: 'on'
  actions:
  - action: notify.all_phones
    data:
      title: Unknown Person — Front Yard Floodlight
      message: Someone unrecognized was detected in the front yard.
      data:
        image: https://ha.example.net/api/frigate/notifications/{{ trigger.payload_json.after.id
          }}/snapshot.jpg
        url: /lovelace
  - delay: 00:05:00
  mode: single
- id: '1783438180673'
  alias: 'Floodlight: Animal Detected Notify'
  description: Low-priority notification when the floodlight's own onboard AI detects
    an animal (Frigate isn't tracking animals on this camera). No light/siren action.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.front_yard_floodlight_animal
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.camera_automations_enabled
    state: 'on'
  actions:
  - action: notify.all_phones
    data:
      title: Animal — Front Yard
      message: The floodlight camera spotted an animal in the front yard.
      data:
        image: /api/camera_proxy/camera.front_yard_floodlight_fluent
        priority: low
  - delay: 00:10:00
  mode: single
- id: '1783438190130'
  alias: 'Floodlight: Unexpected Vehicle Alert'
  description: Notification when a car ends its tracked event in driveway_zone at
    night while away — skipped when someone's home since an unexpected driveway car
    matters far less then.
  triggers:
  - trigger: mqtt
    topic: frigate/events
  conditions:
  - condition: template
    value_template: '{{ trigger.payload_json is not none and trigger.payload_json.type
      == ''end'' and trigger.payload_json.after.camera == ''front_floodlight'' and
      trigger.payload_json.after.label == ''car'' and ''driveway_zone'' in (trigger.payload_json.after.current_zones
      | default([])) }}'
  - condition: sun
    after: sunset
    before: sunrise
  - condition: state
    entity_id: input_boolean.away_mode_active
    state: 'on'
  - condition: state
    entity_id: input_boolean.camera_automations_enabled
    state: 'on'
  actions:
  - action: notify.all_phones
    data:
      title: Vehicle in Driveway — Away Mode
      message: A car was detected in the driveway while away mode is active.
      data:
        image: https://ha.example.net/api/frigate/notifications/{{ trigger.payload_json.after.id
          }}/snapshot.jpg
        url: /lovelace
        priority: high
  - delay: 00:05:00
  mode: single
- id: '1783438199404'
  alias: 'Floodlight: Loitering Siren Escalation'
  description: Opt-in escalation (off by default via input_boolean.floodlight_siren_escalation_enabled).
    Fires a brief siren burst if the floodlight's own person sensor stays on continuously
    for 45s at night. Not identity-aware — will also fire for Riley/Casey lingering,
    since that requires the not-yet-built behavior-tracker service (roadmap Phase
    1). Intentionally simple stopgap.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.front_yard_floodlight_person
    to: 'on'
    for: 00:00:45
  conditions:
  - condition: sun
    after: sunset
    before: sunrise
  - condition: state
    entity_id: input_boolean.floodlight_siren_escalation_enabled
    state: 'on'
  - condition: state
    entity_id: input_boolean.camera_automations_enabled
    state: 'on'
  actions:
  - action: siren.turn_on
    target:
      entity_id: siren.front_yard_floodlight_siren
  - delay: 00:00:05
  - action: siren.turn_off
    target:
      entity_id: siren.front_yard_floodlight_siren
  - action: notify.all_phones
    data:
      title: Prolonged Presence — Front Yard
      message: Someone has been in the front yard for 45+ seconds at night. Siren
        escalation triggered.
      data:
        priority: high
  - delay: 00:15:00
  mode: single
- id: '1783514784360'
  alias: 'Camera: Backyard Floodlight On Motion'
  description: Turn on the backyard flood light (switch.outdoor_gang_switch_l3, a
    dusk-to-dawn fixture whose own photocell decides actual illumination) and the
    Govee outdoor string lights (light.h702b) only when a person is detected in backyard_zone
    at night; auto-off 10 min after last detection. Previously left on 24/7, lighting
    up every night regardless of activity.
  triggers:
  - topic: frigate/events
    trigger: mqtt
  conditions:
  - condition: template
    value_template: "{{ trigger.payload_json is not none\n   and trigger.payload_json.type
      in ['update', 'end']\n   and trigger.payload_json.after.camera == 'backyard'\n
      \  and trigger.payload_json.after.label == 'person'\n   and 'backyard_zone'
      in (trigger.payload_json.after.current_zones | default([])) }}\n"
  - condition: state
    entity_id: input_boolean.camera_automations_enabled
    state: 'on'
  - condition: sun
    after: sunset
    before: sunrise
  actions:
  - target:
      entity_id: switch.outdoor_gang_switch_l3
    action: switch.turn_on
  - target:
      entity_id: light.h702b
    action: light.turn_on
  - delay: 00:10:00
  - target:
      entity_id: switch.outdoor_gang_switch_l3
    action: switch.turn_off
  - target:
      entity_id: light.h702b
    action: light.turn_off
  mode: restart
- id: '1784747771602'
  alias: 'Door: Front Door Opened — Arrival Grace Period'
  description: Flags a 90s window after the front door opens; camera automations use
    this to treat a person-detection during the window as an explained resident arrival/departure
    rather than an unknown-person event.
  triggers:
  - trigger: state
    entity_id: binary_sensor.front_door_contact
    to: 'on'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.door_recently_opened_front
  - delay: 00:01:30
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.door_recently_opened_front
  mode: restart
- id: '1784747773587'
  alias: 'Door: Back Door Opened — Arrival Grace Period'
  description: Flags a 5-minute window after the back door opens; camera automations
    use this to treat a person-detection during the window as an explained resident
    arrival/departure rather than an unknown-person event.
  triggers:
  - trigger: state
    entity_id: binary_sensor.back_door_contact
    to: 'on'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.door_recently_opened_back
  - delay: 00:05:00
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.door_recently_opened_back
  mode: restart
- id: camera_carport_floodlight_on_motion
  alias: 'Camera: Carport Floodlight On Motion'
  description: Turn on the carport flood light (switch.outdoor_plug, a plug-in spotlight)
    when a person is detected in backyard_zone at night; auto-off 10 min after last
    detection. Mirrors camera_backyard_floodlight_on_motion (L3).
  triggers:
  - trigger: mqtt
    topic: frigate/events
  conditions:
  - condition: template
    value_template: "{{ trigger.payload_json is not none\n   and trigger.payload_json.type
      in ['update', 'end']\n   and trigger.payload_json.after.camera == 'backyard'\n
      \  and trigger.payload_json.after.label == 'person'\n   and 'backyard_zone'
      in (trigger.payload_json.after.current_zones | default([])) }}\n"
  - condition: state
    entity_id: input_boolean.camera_automations_enabled
    state: 'on'
  - condition: sun
    after: sunset
    before: sunrise
  actions:
  - target:
      entity_id: switch.outdoor_plug
    action: switch.turn_on
  - delay: 00:10:00
  - target:
      entity_id: switch.outdoor_plug
    action: switch.turn_off
  mode: restart
- id: '1788734819131'
  alias: 'Camera: Rear Floodlight On Motion'
  description: Turn on the Rear Flood Light (switch.rear_flood_light, a Kasa HS103
    plug-in floodlight covering both front and back per user description) as early
    as possible when a person OR car is detected in backyard_zone (backyard camera,
    person only) or yard_zone/driveway_zone (front_floodlight camera, person or car)
    at night; auto-off 10 min after last detection. Car detection added so it reacts
    the moment a vehicle pulls into the driveway instead of waiting for the driver
    to get out and be classified as a person. Reacts on Frigate's 'new' event (first
    sighting) as well as 'update'/'end', not just the latter two, to shave off the
    delay before the first periodic update. Mirrors camera_backyard_floodlight_on_motion
    / camera_carport_floodlight_on_motion.
  triggers:
  - trigger: mqtt
    topic: frigate/events
  conditions:
  - condition: template
    value_template: "{{ trigger.payload_json is not none\n   and trigger.payload_json.type
      in ['new', 'update', 'end']\n   and (\n     (trigger.payload_json.after.camera
      == 'backyard' and trigger.payload_json.after.label == 'person' and 'backyard_zone'
      in (trigger.payload_json.after.current_zones | default([])))\n     or (trigger.payload_json.after.camera
      == 'front_floodlight' and trigger.payload_json.after.label in ['person', 'car']
      and (\n       'yard_zone' in (trigger.payload_json.after.current_zones | default([]))\n
      \      or 'driveway_zone' in (trigger.payload_json.after.current_zones | default([]))\n
      \    ))\n   ) }}\n"
  - condition: state
    entity_id: input_boolean.camera_automations_enabled
    state: 'on'
  - condition: sun
    after: sunset
    before: sunrise
  actions:
  - target:
      entity_id: switch.rear_flood_light
    action: switch.turn_on
  - delay: 00:10:00
  - target:
      entity_id: switch.rear_flood_light
    action: switch.turn_off
  mode: restart
