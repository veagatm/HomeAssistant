        entity_id: binary_sensor.mmw_motion_sensor_occupancy
        state: 'on'
      sequence:
      - target:
          entity_id:
          - light.living_room
          - light.lamp
        data:
          brightness: '{% set h = now().hour + now().minute / 60 %} {% if h >= 22
            or h < 6 %}51 {% elif h >= 6 and h < 9 %}178 {% elif h >= 9 and h < 17
            %}255 {% else %}191{% endif %}

            '
          color_temp_kelvin: '{% set h = now().hour + now().minute / 60 %} {% if h
            >= 22 or h < 6 %}2200 {% elif h >= 6 and h < 9 %}2700 {% elif h >= 9 and
            h < 17 %}4000 {% else %}2500{% endif %}

            '
          transition: 3
        action: light.turn_on
    default:
    - target:
        entity_id:
        - light.living_room
        - light.lamp
      action: light.turn_off
