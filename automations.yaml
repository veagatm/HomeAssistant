- id: lr_motion_on
  alias: LR - Motion On → Lights
  description: Turn on lights on motion; restore memory scene if within 30-min window
  triggers:
  - entity_id: binary_sensor.mmw_motion_sensor_occupancy
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.automations_living_room
    state: 'on'
  - condition: template
    value_template: '{% set ts = state_attr(''input_datetime.snooze_lr_motion'', ''timestamp'')
      %} {{ ts is none or ts < now().timestamp() }}

      '
  - condition: not
    conditions:
    - condition: state
      entity_id: media_player.roku_ultra
      state: playing
    - condition: state
      entity_id: media_player.roku_ultra
      state: paused
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.automation_memory_lights_lr
        state: 'on'
      - condition: template
        value_template: '{% set ts = state_attr(''input_datetime.snooze_memory_lights_lr'',
          ''timestamp'') %} {{ ts is none or ts < now().timestamp() }}

          '
      - condition: template
        value_template: '{% set ts = state_attr(''input_datetime.memory_lights_lr_off_at'',
          ''timestamp'') %} {{ ts is not none and (now().timestamp() - ts) < 1800
          }}

          '
      - condition: state
        entity_id: light.living_room
        state: 'off'
      sequence:
      - target:
          entity_id: scene.memory_lights_lr
        action: scene.turn_on
    default:
    - condition: state
      entity_id: sensor.mmw_motion_sensor_illumination
      state: dim
    - choose:
      - conditions:
        - condition: state
          entity_id: input_select.lighting_mode_living_room
          state: Working
        sequence:
        - target:
            entity_id:
            - light.living_room
            - light.lamp
          data:
            brightness: '{{ states(''input_number.mode_working_brightness'') | int
              }}'
            color_temp_kelvin: '{{ states(''input_number.mode_working_color_temp'')
              | int }}'
            transition: 2
          action: light.turn_on
      - conditions:
        - condition: state
          entity_id: input_select.lighting_mode_living_room
          state: Casual
        sequence:
        - target:
            entity_id:
            - light.living_room
            - light.lamp
          data:
            brightness: '{{ states(''input_number.mode_casual_brightness'') | int
              }}'
            color_temp_kelvin: '{{ states(''input_number.mode_casual_color_temp'')
              | int }}'
            transition: 3
          action: light.turn_on
      - conditions:
        - condition: state
          entity_id: input_select.lighting_mode_living_room
          state: Chill
        sequence:
        - target:
            entity_id:
            - light.living_room
            - light.lamp
          data:
            brightness: '{{ states(''input_number.mode_chill_brightness'') | int }}'
            color_temp_kelvin: '{{ states(''input_number.mode_chill_color_temp'')
              | int }}'
            transition: 5
          action: light.turn_on
      - conditions:
        - condition: state
          entity_id: input_select.lighting_mode_living_room
          state: Movie
        sequence:
        - target:
            entity_id:
            - light.living_room
            - light.lamp
          data:
            brightness: '{{ states(''input_number.mode_movie_brightness'') | int }}'
            color_temp_kelvin: '{{ states(''input_number.mode_movie_color_temp'')
              | int }}'
            transition: 5
          action: light.turn_on
      - conditions:
        - condition: state
          entity_id: input_select.lighting_mode_living_room
          state: Party
        sequence:
        - target:
            entity_id:
            - light.living_room
            - light.lamp
          data:
            rgb_color:
            - '{% set c = states(''input_select.party_color_living_room'') %}{% if
              c == ''Red'' %}255{% elif c == ''Orange'' %}255{% elif c == ''Yellow''
              %}255{% elif c == ''Green'' %}0{% elif c == ''Teal'' %}0{% elif c ==
              ''Blue'' %}0{% elif c == ''Purple'' %}150{% else %}255{% endif %}'
            - '{% set c = states(''input_select.party_color_living_room'') %}{% if
              c == ''Red'' %}0{% elif c == ''Orange'' %}87{% elif c == ''Yellow''
              %}200{% elif c == ''Green'' %}200{% elif c == ''Teal'' %}200{% elif
              c == ''Blue'' %}100{% elif c == ''Purple'' %}0{% else %}0{% endif %}'
            - '{% set c = states(''input_select.party_color_living_room'') %}{% if
              c == ''Red'' %}0{% elif c == ''Orange'' %}0{% elif c == ''Yellow'' %}0{%
              elif c == ''Green'' %}0{% elif c == ''Teal'' %}150{% elif c == ''Blue''
              %}255{% elif c == ''Purple'' %}255{% else %}150{% endif %}'
            brightness: 204
            transition: 2
          action: light.turn_on
      default:
      - target:
          entity_id:
          - light.living_room
          - light.lamp
        data:
          brightness: '{% set h = now().hour + now().minute / 60 %}

            {% if h >= 22 or h < 6 %}51

            {% elif h >= 6 and h < 9 %}178

            {% elif h >= 9 and h < 17 %}255

            {% else %}191{% endif %}

            '
          color_temp_kelvin: '{% set h = now().hour + now().minute / 60 %}

            {% if h >= 22 or h < 6 %}2200

            {% elif h >= 6 and h < 9 %}2700

            {% elif h >= 9 and h < 17 %}4000

            {% else %}2500{% endif %}

            '
          transition: 1
        action: light.turn_on
  mode: restart
- id: lr_motion_off
  alias: LR - No Motion 10 min → Snapshot & Lights Off
  description: Snapshot scene for memory lights then turn off; falls back to plain
    off if memory lights disabled
  triggers:
  - entity_id: binary_sensor.mmw_motion_sensor_occupancy
    to: 'off'
    for:
      minutes: 10
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.automations_living_room
    state: 'on'
  - condition: template
    value_template: '{% set ts = state_attr(''input_datetime.snooze_lr_motion'', ''timestamp'')
      %} {{ ts is none or ts < now().timestamp() }}

      '
  - condition: not
    conditions:
    - condition: state
      entity_id: media_player.roku_ultra
      state: playing
    - condition: state
      entity_id: media_player.roku_ultra
      state: paused
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.automation_memory_lights_lr
        state: 'on'
      - condition: template
        value_template: '{% set ts = state_attr(''input_datetime.snooze_memory_lights_lr'',
          ''timestamp'') %} {{ ts is none or ts < now().timestamp() }}

          '
      - condition: state
        entity_id: light.living_room
        state: 'on'
      sequence:
      - data:
          scene_id: memory_lights_lr
          snapshot_entities:
          - light.living_room
          - light.lamp
        action: scene.create
      - target:
          entity_id: input_datetime.memory_lights_lr_off_at
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
        action: input_datetime.set_datetime
      - target:
          entity_id:
          - light.living_room
          - light.lamp
        action: light.turn_off
    default:
    - target:
        entity_id:
        - light.living_room
        - light.lamp
      action: light.turn_off
- id: lr_tv_on_pre_movie
  alias: LR - TV On → Pre-Movie Mode
  trigger:
  - platform: state
    entity_id: media_player.living_room_tv
    to: 'on'
    for: 00:00:02
  condition:
  - condition: state
    entity_id: input_boolean.automations_living_room
    state: 'on'
  action:
  - service: light.turn_on
    target:
      entity_id:
      - light.living_room
      - light.lamp
    data:
      brightness: 204
      rgb_color:
      - 255
      - 0
      - 0
      transition: 3
- id: lr_tv_playing
  alias: LR - TV Playing → Movie Mode
  triggers:
  - entity_id: media_player.roku_ultra
    to: playing
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.automations_living_room
    state: 'on'
  actions:
  - target:
      entity_id:
      - light.living_room
      - light.lamp
    data:
      brightness: '{{ iif(states(''sensor.mmw_motion_sensor_illumination'') == ''bright'',
        26, 13) }}

        '
      rgb_color:
      - 255
      - 0
      - 0
      transition: 3
    action: light.turn_on
- id: lr_tv_paused_idle
  alias: LR - TV Paused/Idle → Pre-Movie Red
