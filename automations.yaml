- id: kit_motion_on
  alias: Kitchen - Motion On → Lights
  triggers:
  - platform: state
    entity_id: binary_sensor.kitchen_motion_sensor_occupancy
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.automations_kitchen
    state: 'on'
  - condition: template
    value_template: '{% set ts = state_attr(''input_datetime.snooze_kit_motion'',
      ''timestamp'') %} {{ ts is none or ts < now().timestamp() }}

      '
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.automation_memory_lights_kit
        state: 'on'
      - condition: template
        value_template: '{% set ts = state_attr(''input_datetime.snooze_memory_lights_kit'',
          ''timestamp'') %} {{ ts is none or ts < now().timestamp() }}

          '
      - condition: template
        value_template: '{% set ts = state_attr(''input_datetime.memory_lights_kit_off_at'',
          ''timestamp'') %} {{ ts is not none and (now().timestamp() - ts) < 1800
          }}

          '
      - condition: state
        entity_id: light.kitchen
        state: 'off'
      sequence:
      - target:
          entity_id: scene.memory_lights_kit
        action: scene.turn_on
    default:
    - choose:
      - conditions:
        - condition: state
          entity_id: input_select.lighting_mode_kitchen
          state: Working
        sequence:
        - target:
            entity_id:
            - light.kitchen
            - light.lightstrip
          data:
            brightness: '{{ states(''input_number.mode_working_brightness'') | int
              }}'
            color_temp_kelvin: '{{ states(''input_number.mode_working_color_temp'')
              | int }}'
            transition: 2
          action: light.turn_on
      - conditions:
        - condition: state
          entity_id: input_select.lighting_mode_kitchen
          state: Casual
        sequence:
        - target:
            entity_id:
            - light.kitchen
            - light.lightstrip
          data:
            brightness: '{{ states(''input_number.mode_casual_brightness'') | int
              }}'
            color_temp_kelvin: '{{ states(''input_number.mode_casual_color_temp'')
              | int }}'
            transition: 3
          action: light.turn_on
      - conditions:
        - condition: state
          entity_id: input_select.lighting_mode_kitchen
          state: Chill
        sequence:
        - target:
            entity_id:
            - light.kitchen
            - light.lightstrip
          data:
            brightness: '{{ states(''input_number.mode_chill_brightness'') | int }}'
            color_temp_kelvin: '{{ states(''input_number.mode_chill_color_temp'')
              | int }}'
            transition: 5
          action: light.turn_on
      - conditions:
        - condition: state
          entity_id: input_select.lighting_mode_kitchen
          state: Movie
        sequence:
        - target:
            entity_id:
            - light.kitchen
            - light.lightstrip
          data:
            brightness: '{{ states(''input_number.mode_movie_brightness'') | int }}'
            color_temp_kelvin: '{{ states(''input_number.mode_movie_color_temp'')
              | int }}'
            transition: 5
          action: light.turn_on
      - conditions:
        - condition: state
          entity_id: input_select.lighting_mode_kitchen
          state: Party
        sequence:
        - target:
            entity_id:
            - light.kitchen
            - light.lightstrip
          data:
            rgb_color:
            - '{% set c = states(''input_select.party_color_kitchen'') %}{% if c ==
              ''Red'' %}255{% elif c == ''Orange'' %}255{% elif c == ''Yellow'' %}255{%
              elif c == ''Green'' %}0{% elif c == ''Teal'' %}0{% elif c == ''Blue''
              %}0{% elif c == ''Purple'' %}150{% else %}255{% endif %}'
            - '{% set c = states(''input_select.party_color_kitchen'') %}{% if c ==
              ''Red'' %}0{% elif c == ''Orange'' %}87{% elif c == ''Yellow'' %}200{%
              elif c == ''Green'' %}200{% elif c == ''Teal'' %}200{% elif c == ''Blue''
              %}100{% elif c == ''Purple'' %}0{% else %}0{% endif %}'
            - '{% set c = states(''input_select.party_color_kitchen'') %}{% if c ==
              ''Red'' %}0{% elif c == ''Orange'' %}0{% elif c == ''Yellow'' %}0{%
              elif c == ''Green'' %}0{% elif c == ''Teal'' %}150{% elif c == ''Blue''
              %}255{% elif c == ''Purple'' %}255{% else %}150{% endif %}'
            brightness: 204
            transition: 2
          action: light.turn_on
      default:
      - target:
          entity_id:
          - light.kitchen
          - light.lightstrip
        data:
          brightness: '{% set h = now().hour + now().minute / 60 %}

            {% if h >= 22 or h < 6 %}51

            {% elif h >= 6 and h < 9 %}178

            {% elif h >= 9 and h < 17 %}255

            {% else %}191{% endif %}

            '
          color_temp_kelvin: '{% set h = now().hour + now().minute / 60 %}

            {% if h >= 22 or h < 6 %}2200

            {% elif h >= 6 and h < 9 %}2700

            {% elif h >= 9 and h < 17 %}4000

            {% else %}2500{% endif %}

            '
          transition: 1
        action: light.turn_on
  mode: restart
