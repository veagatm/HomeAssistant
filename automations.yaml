- id: irrigation_sprinklers_schedule
  alias: 'Irrigation: Sprinklers Morning'
  description: Daily sprinkler run at 6:00 AM — runs first to prevent zone overlap
    with trees
  trigger:
  - platform: time
    at: 06:00:00
  condition:
  - condition: state
    entity_id: input_boolean.irrigation_sprinklers_enabled
    state: 'on'
  - condition: state
    entity_id: input_boolean.away_mode_active
    state: 'off'
  - condition: template
    value_template: "{{ not states('weather.home') in ['rainy', 'pouring', 'snowy']
      or\n   is_state('input_boolean.irrigation_rain_skip', 'off') }}\n"
  action:
  - service: script.run_irrigation_zone
    data:
      zone_entity: switch.sprinklers_valve
      duration_minutes: 15
  - service: input_datetime.set_datetime
    target:
      entity_id: input_datetime.irrigation_sprinklers_last_run
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
- id: irrigation_trees_schedule
  alias: 'Irrigation: Trees Morning'
  description: Daily tree drip run at 6:30 AM — offset 30 min to start after sprinklers
    finish
  trigger:
  - platform: time
    at: 06:30:00
  condition:
  - condition: state
    entity_id: input_boolean.irrigation_trees_enabled
    state: 'on'
  - condition: state
    entity_id: input_boolean.away_mode_active
    state: 'off'
  - condition: template
    value_template: "{{ not states('weather.home') in ['rainy', 'pouring', 'snowy']
      or\n   is_state('input_boolean.irrigation_rain_skip', 'off') }}\n"
  action:
  - service: script.run_irrigation_zone
    data:
      zone_entity: switch.trees_valve
      duration_minutes: 45
  - service: input_datetime.set_datetime
    target:
      entity_id: input_datetime.irrigation_trees_last_run
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
- id: irrigation_burst_alert
  alias: 'Irrigation: High Flow / Burst Alert'
  description: Close all valves and alert if any zone reports abnormally high flow
    for 2 min
  mode: single
  trigger:
  - platform: numeric_state
    entity_id: sensor.trees_valve_flow
    above: 40
    for: 00:02:00
  - platform: numeric_state
    entity_id: sensor.sprinklers_valve_flow
    above: 40
    for: 00:02:00
  action:
  - service: switch.turn_off
    target:
      entity_id:
      - switch.trees_valve
      - switch.sprinklers_valve
      - switch.utility_valve
  - service: notify.all_phones
    data:
      title: ⚠️ Irrigation Leak?
      message: 'High water flow (>40 L/min) on {{ trigger.entity_id | replace(''sensor.'','''')
        | replace(''_flow'','''') | replace(''_'','' '') | title }}. All valves closed
        automatically.

        '
- id: irrigation_valve_safety_shutoff
  alias: 'Irrigation: Safety Shutoff (90 min)'
  description: Auto-close any valve open more than 90 minutes — prevents flooding
    if a schedule fails
  trigger:
  - platform: state
    entity_id: switch.trees_valve
    to: 'on'
    for: 01:30:00
  - platform: state
    entity_id: switch.sprinklers_valve
    to: 'on'
    for: 01:30:00
  - platform: state
    entity_id: switch.utility_valve
    to: 'on'
    for: 01:30:00
  action:
  - service: switch.turn_off
    target:
      entity_id: '{{ trigger.entity_id }}'
  - service: notify.all_phones
    data:
      title: "\U0001F4A7 Irrigation Auto-Off"
      message: '{{ trigger.entity_id | replace(''switch.'','''') | replace(''_'',''
        '') | title }} was left on for 90 min and was automatically closed.

        '
- id: cam_unknown_front_yard
  alias: 'Camera: Unknown Person — Front Yard Alert'
  description: Alert when an unrecognized person is detected in front_zone
  triggers:
  - topic: frigate/events
    trigger: mqtt
  conditions:
  - condition: template
    value_template: "{{ trigger.payload_json is not none\n   and trigger.payload_json.type
      == 'end'\n   and trigger.payload_json.after.camera == 'front'\n   and trigger.payload_json.after.label
      == 'person'\n   and trigger.payload_json.after.sub_label is none\n   and 'front_zone'
      in (trigger.payload_json.after.current_zones | default([])) }}\n"
  - condition: state
    entity_id: input_boolean.camera_automations_enabled
    state: 'on'
  - condition: not
    conditions:
    - condition: state
      entity_id: input_boolean.door_recently_opened_front
      state: 'on'
  actions:
  - data:
      title: Unknown Person — Front Yard
      message: Someone unrecognized was detected in the front yard.
      data:
        image: https://ha.example.net/api/frigate/notifications/{{ trigger.payload_json.after.id
          }}/snapshot.jpg
        url: /lovelace
    action: notify.all_phones
  - delay: 00:05:00
  mode: restart
- id: cam_unknown_backyard
  alias: 'Camera: Unknown Person — Backyard Alert'
  description: Alert and trigger backyard floodlight when an unrecognized person is
    detected in backyard_zone
  triggers:
  - topic: frigate/events
    trigger: mqtt
  conditions:
  - condition: template
    value_template: "{{ trigger.payload_json is not none\n   and trigger.payload_json.type
      == 'end'\n   and trigger.payload_json.after.camera == 'backyard'\n   and trigger.payload_json.after.label
      == 'person'\n   and trigger.payload_json.after.sub_label is none\n   and 'backyard_zone'
      in (trigger.payload_json.after.current_zones | default([])) }}\n"
  - condition: state
    entity_id: input_boolean.camera_automations_enabled
    state: 'on'
  - condition: not
    conditions:
    - condition: state
      entity_id: input_boolean.door_recently_opened_back
      state: 'on'
  actions:
  - data:
      title: Unknown Person — Backyard
      message: Someone unrecognized was detected in the backyard.
      data:
        image: https://ha.example.net/api/frigate/notifications/{{ trigger.payload_json.after.id
          }}/snapshot.jpg
        url: /lovelace
    action: notify.all_phones
  - if:
    - condition: sun
      after: sunset
      before: sunrise
    then:
    - target:
        entity_id: light.backyard_floodlight
      action: light.turn_on
  - delay: 00:05:00
  - target:
      entity_id: light.backyard_floodlight
    action: light.turn_off
  mode: restart
- id: cam_riley_backyard
  alias: 'Camera: Riley Backyard Mode'
  description: Set Riley in Backyard flag on detection; auto-clears 10 min after last
    sighting (mode:restart resets timer)
  mode: restart
  trigger:
  - platform: mqtt
    topic: frigate/events
  condition:
  - condition: template
    value_template: "{{ trigger.payload_json is not none\n   and trigger.payload_json.type
      in ['update', 'end']\n   and trigger.payload_json.after.camera == 'backyard'\n
      \  and trigger.payload_json.after.label == 'person'\n   and trigger.payload_json.after.sub_label
      == 'Riley'\n   and 'backyard_zone' in (trigger.payload_json.after.current_zones
      | default([])) }}\n"
  action:
  - service: input_boolean.turn_on
    target:
      entity_id:
      - input_boolean.riley_in_backyard
      - input_boolean.backyard_mode_active
  - delay: 00:10:00
  - service: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.riley_in_backyard
      - input_boolean.backyard_mode_active
- id: cam_unknown_visitor_count
  alias: 'Camera: Unknown Visitor Counter'
  description: Increment weekly unknown visitor counter when an unrecognized person
    ends an event in any monitored zone
  triggers:
  - topic: frigate/events
    trigger: mqtt
  conditions:
  - condition: template
    value_template: "{{ trigger.payload_json is not none\n   and trigger.payload_json.type
      == 'end'\n   and trigger.payload_json.after.label == 'person'\n   and trigger.payload_json.after.sub_label
      is none\n   and (\n     (trigger.payload_json.after.camera == 'front'\n      and
      'front_zone' in (trigger.payload_json.after.current_zones | default([])))\n
      \    or\n     (trigger.payload_json.after.camera == 'backyard'\n      and 'backyard_zone'
      in (trigger.payload_json.after.current_zones | default([])))\n   ) }}\n"
  - condition: state
    entity_id: input_boolean.camera_automations_enabled
    state: 'on'
  - condition: not
    conditions:
    - condition: state
      entity_id: input_boolean.door_recently_opened_front
      state: 'on'
  - condition: not
    conditions:
    - condition: state
      entity_id: input_boolean.door_recently_opened_back
      state: 'on'
  actions:
  - target:
      entity_id: counter.unknown_visitors_week
    action: counter.increment
  mode: queued
  max: 5
- id: cam_unknown_threshold_alert
  alias: 'Camera: Unknown Visitor Threshold Alert'
  description: Persistent notification when weekly unknown visitor count reaches threshold
  mode: single
  trigger:
  - platform: state
    entity_id: counter.unknown_visitors_week
  condition:
  - condition: template
    value_template: "{{ states('counter.unknown_visitors_week') | int(0) >=\n   states('input_number.unknown_visitor_threshold')
      | int(5) }}\n"
  action:
  - service: persistent_notification.create
    data:
      title: Unknown Visitor Alert
      message: '{{ states(''counter.unknown_visitors_week'') }} unknown visitors detected
        this week (threshold: {{ states(''input_number.unknown_visitor_threshold'')
        | int(5) }}).

        '
      notification_id: unknown_visitor_threshold
- id: cam_weekly_counter_reset
  alias: 'Camera: Weekly Visitor Counter Reset'
  description: Reset unknown visitor counter at midnight every Sunday
  mode: single
  trigger:
  - platform: time
    at: 00:00:00
  condition:
  - condition: time
    weekday:
    - sun
  action:
  - service: counter.reset
    target:
      entity_id: counter.unknown_visitors_week
  - service: persistent_notification.dismiss
    data:
      notification_id: unknown_visitor_threshold
