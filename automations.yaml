- id: sys_internet_down
  alias: System - Internet Down → Alert
  description: Ping 8.8.8.8 fails 2 min → TTS + flash Govee lamps red + persistent
    notification
  trigger:
  - platform: state
    entity_id: binary_sensor.ping_google
    to: 'off'
    for:
      minutes: 2
  - platform: state
    entity_id: binary_sensor.ping_google
    to: unavailable
    for:
      minutes: 2
  condition:
  - condition: state
    entity_id: input_boolean.automation_internet_outage
    state: 'on'
  - condition: template
    value_template: '{% set ts = state_attr(''input_datetime.snooze_internet_outage'',
      ''timestamp'') %} {{ ts is none or ts < now().timestamp() }}

      '
  action:
  - service: persistent_notification.create
    data:
      title: ⚠️ Internet Down
      message: Ping to 8.8.8.8 failing for 2+ min. Check the Deco router.
      notification_id: internet_outage
  - service: tts.speak
    target:
      entity_id: tts.google_en_com
    data:
      media_player_entity_id: media_player.kitchen_speaker
      message: 'Alert: the internet connection appears to be down.'
  - service: light.turn_on
    target:
      entity_id:
      - light.govee_lamp_1
      - light.lamp
    data:
      rgb_color:
      - 255
      - 0
      - 0
      brightness: 255
      transition: 1
  - delay:
      seconds: 5
  - service: light.turn_off
    target:
      entity_id:
      - light.govee_lamp_1
      - light.lamp
