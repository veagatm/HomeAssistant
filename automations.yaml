- id: '1791304093392'
  alias: System - UPS Power Alert
  description: Notify both phones when the UPS switches to battery (power outage,
    15s debounce), when power is restored (on->off only; unavailable->off from a Mac/monitor
    restart is ignored), and when battery drops below 30% while on battery. Fed by
    HomeAssistant/ups/ups_monitor.py on the Mac Mini via MQTT.
  triggers:
  - trigger: state
    entity_id: binary_sensor.ups_on_battery
    from: 'off'
    to: 'on'
    for:
      seconds: 15
    id: outage
  - trigger: state
    entity_id: binary_sensor.ups_on_battery
    from: 'on'
    to: 'off'
    id: restored
  - trigger: numeric_state
    entity_id: sensor.ups_battery
    below: 30
    id: low
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: outage
      sequence:
      - action: notify.all_phones
        data:
          title: ⚡ Power Out
          message: House is on UPS battery ({{ states('sensor.ups_battery') }}%).
            Mac, HA, and internet are running on backup.
          data:
            priority: high
            ttl: 0
            tag: ups_power
    - conditions:
      - condition: trigger
        id: restored
      sequence:
      - action: notify.all_phones
        data:
          title: ✅ Power Restored
          message: Back on wall power after {{ ((now() - trigger.from_state.last_changed).total_seconds()
            / 60) | round(1) }} min. UPS battery at {{ states('sensor.ups_battery')
            }}%.
          data:
            tag: ups_power
    - conditions:
      - condition: trigger
        id: low
      - condition: state
        entity_id: binary_sensor.ups_on_battery
        state: 'on'
      sequence:
      - action: notify.all_phones
        data:
          title: "\U0001F50B UPS Battery Low"
          message: UPS battery at {{ states('sensor.ups_battery') }}% and still no
            wall power. Mac will shut down soon; HA and network will follow.
          data:
            priority: high
            ttl: 0
            tag: ups_power
  mode: queued
- id: '1791475881141'
  alias: Bed - Front Yard Motion → TV Camera PiP
  description: 'Show the front yard camera as a QuickBars picture-in-picture overlay
    on the bedroom Google TV when front yard motion is detected. QuickBars app listens
    for the quickbars.open event over its persistent HA WebSocket (requires ''Persistent
    background connection'' enabled in the app). PiP is a toggle — re-sending the
    same camera hides it — so mode: single plus a delay longer than auto_hide prevents
    flicker.'
  triggers:
  - trigger: state
    entity_id: binary_sensor.front_yard_motion
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.automations_bedroom
    state: 'on'
  - condition: state
    entity_id: input_boolean.automation_bed_tv_camera_pip
    state: 'on'
  - condition: state
    entity_id: input_boolean.away_mode_active
    state: 'off'
  - condition: template
    value_template: '{% set ts = state_attr(''input_datetime.snooze_bed_tv_camera_pip'',
      ''timestamp'') %} {{ ts is none or ts < now().timestamp() }}'
  - condition: not
    conditions:
    - condition: state
      entity_id: media_player.bedroom_tv_2_2
      state:
      - 'off'
      - standby
      - unavailable
      - unknown
  actions:
  - event: quickbars.open
    event_data:
      camera_entity: camera.front_yard_fluent
      camera_title: Front Yard
      show_title: true
      position: top_right
      size: medium
      auto_hide: 30
      show_toast: false
  - delay:
      seconds: 35
  mode: single
  max_exceeded: silent
