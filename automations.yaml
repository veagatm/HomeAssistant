- id: '1778781312032'
  alias: Plant - Fescue Grass Low Moisture Alert
  description: 'Fescue soil moisture below 25% for 30 min → notify; 24-hr cooldown.
    Healthy range: 30–50%.'
  triggers:
  - platform: numeric_state
    entity_id: sensor.fescue_grass_soil_moisture_soil_moisture
    below: 25
    for: 00:30:00
  conditions:
  - condition: state
    entity_id: input_boolean.automation_plant_fescue
    state: 'on'
  actions:
  - data:
      title: "\U0001F33F Fescue Grass Needs Water"
      message: 'Soil moisture at {{ states(''sensor.fescue_grass_soil_moisture_soil_moisture'')
        | round(1) }}% — below 25% alert threshold. Healthy range: 30–50%.'
    action: notify.all_phones
  - delay:
      hours: 24
  mode: single
  max_exceeded: silent
- id: '1778781316068'
  alias: Plant - Green Giant Low Moisture Alert
  description: 'Green Giant soil moisture below 20% for 30 min → notify; 24-hr cooldown.
