- id: kitchen_blinds_close_when_hot_and_sunny
  alias: 'Kitchen Blinds: Close When Hot And Sunny'
  description: Close kitchen blinds when sunny/partly cloudy above 78F in spring/summer/fall.
    Skips if Kitchen is in Casual mode; lowers to 50% instead of fully closing if
    in Chill mode.
  triggers:
  - entity_id: weather.home
    to:
    - sunny
    - partlycloudy
    trigger: state
  conditions:
  - condition: numeric_state
    entity_id: weather.home
    attribute: temperature
    above: 78
  - condition: template
    value_template: '{{ now().month not in [11, 12, 1, 2] }}'
  - condition: state
    entity_id: input_boolean.away_mode_active
    state: 'off'
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.lighting_mode_kitchen
        state: Casual
      sequence: []
    - conditions:
      - condition: state
        entity_id: input_select.lighting_mode_kitchen
        state: Chill
      sequence:
      - action: cover.set_cover_position
        target:
          entity_id: cover.kitchen_blinds
        data:
          position: 50
    default:
    - action: cover.close_cover
      target:
        entity_id: cover.kitchen_blinds
  mode: single
- id: kitchen_blinds_reopen_when_conditions_improve
  alias: 'Kitchen Blinds: Reopen When Conditions Improve'
  description: Reopen kitchen blinds when weather is no longer hot and sunny
  triggers:
  - platform: state
    entity_id: weather.home
  - platform: numeric_state
    entity_id: weather.home
    attribute: temperature
    below: 76
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: weather.home
      state:
      - sunny
      - partlycloudy
  - condition: state
    entity_id: cover.kitchen_blinds
    state: closed
  - condition: state
    entity_id: input_boolean.away_mode_active
    state: 'off'
  actions:
  - action: cover.open_cover
    target:
      entity_id: cover.kitchen_blinds
  mode: single
