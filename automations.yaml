- id: bed_sw_single
  alias: Bed Switch - Single → Toggle Lights
  trigger:
  - platform: mqtt
    topic: zigbee2mqtt/bedroom switch/action
    payload: single
  action:
  - service: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.bed_manual_mode
      - input_boolean.sleep_mode_active
  - choose:
    - conditions:
      - condition: state
        entity_id: light.bedroom
        state: 'on'
      sequence:
      - service: light.turn_off
        target:
          entity_id:
          - light.bedroom
          - light.govee_lamp_1
    default:
    - service: light.turn_on
      target:
        entity_id:
        - light.bedroom
        - light.govee_lamp_1
      data:
        brightness: '{% set h = now().hour + now().minute / 60 %} {% if h >= 22 or
          h < 6 %}51 {% elif h >= 6 and h < 9 %}178 {% elif h >= 9 and h < 17 %}255
          {% else %}191{% endif %}

          '
        color_temp_kelvin: '{% set h = now().hour + now().minute / 60 %} {% if h >=
          22 or h < 6 %}2200 {% elif h >= 6 and h < 9 %}2700 {% elif h >= 9 and h
          < 17 %}4000 {% else %}2500{% endif %}

          '
        transition: 1
- id: bed_sw_double
  alias: Bed Switch - Double → Movie Mode
  trigger:
  - platform: mqtt
    topic: zigbee2mqtt/bedroom switch/action
    payload: double
  action:
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.bed_manual_mode
  - service: scene.turn_on
    target:
      entity_id: scene.bedroom_red
  - service: light.turn_on
    target:
      entity_id: light.govee_lamp_1
    data:
      brightness: 51
      rgb_color:
      - 255
      - 0
      - 0
      transition: 2
- id: bed_sw_hold
  alias: Bed Switch - Hold → Good Night (All Lights Off)
  trigger:
  - platform: mqtt
    topic: zigbee2mqtt/bedroom switch/action
    payload: hold
  action:
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.sleep_mode_active
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.bed_manual_mode
  - service: light.turn_off
    target:
      entity_id:
      - light.living_room
      - light.lamp
      - light.bedroom
      - light.govee_lamp_1
