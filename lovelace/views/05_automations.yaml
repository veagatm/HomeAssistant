title: Automations
path: automations
icon: mdi:robot

cards:

  # ── Active Snoozes (conditional — only shown when something is snoozed) ────────
  - type: conditional
    conditions:
      - condition: template
        value_template: >
          {% set ns = namespace(any=false) %}
          {% set ids = ['lr_motion','bed_motion','kit_motion','hall_motion',
                        'washer_alert','dryer_alert','internet_outage',
                        'away_mode','arriving_home','sleep_mode','wake_mode',
                        'trash_reminder','memory_lights_lr','memory_lights_bed',
                        'memory_lights_kit'] %}
          {% for id in ids %}
            {% if state_attr('input_datetime.snooze_' ~ id, 'timestamp') | float(0) > now().timestamp() %}
              {% set ns.any = true %}
            {% endif %}
          {% endfor %}
          {{ ns.any }}
    card:
      type: vertical-stack
      cards:
        - type: custom:mushroom-template-card
          primary: Active Snoozes
          secondary: >
            {% set ns = namespace(items=[]) %}
            {% set snoozes = [
              ('lr_motion', 'LR Motion'),
              ('bed_motion', 'Bed Motion'),
              ('kit_motion', 'Kitchen'),
              ('hall_motion', 'Hallway'),
              ('washer_alert', 'Washer'),
              ('dryer_alert', 'Dryer'),
              ('internet_outage', 'Internet'),
              ('away_mode', 'Away Mode'),
              ('arriving_home', 'Arriving'),
              ('sleep_mode', 'Sleep'),
              ('wake_mode', 'Wake'),
              ('trash_reminder', 'Trash'),
              ('memory_lights_lr', 'Mem LR'),
              ('memory_lights_bed', 'Mem Bed'),
              ('memory_lights_kit', 'Mem Kit')
            ] %}
            {% for id, label in snoozes %}
              {% set ts = state_attr('input_datetime.snooze_' ~ id, 'timestamp') | float(0) %}
              {% if ts > now().timestamp() %}
                {% set ns.items = ns.items + [label ~ ' until ' ~ (ts | timestamp_custom('%-I:%M %p'))] %}
              {% endif %}
            {% endfor %}
            {{ ns.items | join(' · ') }}
          icon: mdi:alarm-snooze
          icon_color: orange
          tap_action:
            action: none
        - type: custom:mushroom-template-card
          primary: Clear All Snoozes
          icon: mdi:alarm-multiple-off
          icon_color: red
          tap_action:
            action: call-service
            service: script.clear_all_snoozes

  # ── Room Master Switches ───────────────────────────────────────────────────────
  - type: custom:mushroom-title-card
    title: Room Switches
    subtitle: Off = all automations in that room disabled

  - type: horizontal-stack
    cards:
      - type: custom:mushroom-entity-card
        entity: input_boolean.automations_living_room
        name: Living Room
        icon: mdi:sofa
        icon_color: >
          {{ 'green' if is_state('input_boolean.automations_living_room', 'on') else 'red' }}
      - type: custom:mushroom-entity-card
        entity: input_boolean.automations_bedroom
        name: Bedroom
        icon: mdi:bed
        icon_color: >
          {{ 'green' if is_state('input_boolean.automations_bedroom', 'on') else 'red' }}
      - type: custom:mushroom-entity-card
        entity: input_boolean.automations_kitchen
        name: Kitchen
        icon: mdi:chef-hat
        icon_color: >
          {{ 'green' if is_state('input_boolean.automations_kitchen', 'on') else 'red' }}

  # ── State Flags ────────────────────────────────────────────────────────────────
  - type: custom:mushroom-title-card
    title: State Flags
    subtitle: Tap to toggle

  - type: horizontal-stack
    cards:
      - type: custom:mushroom-entity-card
        entity: input_boolean.sleep_mode_active
        name: Sleep
        icon: mdi:sleep
        icon_color: >
          {{ 'indigo' if is_state('input_boolean.sleep_mode_active', 'on') else 'grey' }}
      - type: custom:mushroom-entity-card
        entity: input_boolean.away_mode_active
        name: Away
        icon: mdi:home-export-outline
        icon_color: >
          {{ 'orange' if is_state('input_boolean.away_mode_active', 'on') else 'green' }}
      - type: custom:mushroom-entity-card
        entity: input_boolean.trash_night
        name: Trash Night
        icon: mdi:trash-can
        icon_color: >
          {{ 'green' if is_state('input_boolean.trash_night', 'on') else 'grey' }}

  # ── Snooze Controls (tap to open popup) ───────────────────────────────────────
  - type: custom:mushroom-title-card
    title: Snooze Controls
    subtitle: Tap a category to snooze or clear

  - type: custom:mushroom-template-card
    primary: Lighting
    secondary: Motion lights & memory scenes
    icon: mdi:lightbulb-auto
    icon_color: amber
    tap_action:
      action: navigate
      navigation_path: "#snooze_lighting"

  - type: custom:mushroom-template-card
    primary: Routines
    secondary: Sleep, wake, away, arriving
    icon: mdi:clock-time-four
    icon_color: cyan
    tap_action:
      action: navigate
      navigation_path: "#snooze_routines"

  - type: custom:mushroom-template-card
    primary: System
    secondary: Washer, dryer, trash, internet
    icon: mdi:cog
    icon_color: purple
    tap_action:
      action: navigate
      navigation_path: "#snooze_system"

  # ── Snooze Popups (vertical-stack: popup header first, content as siblings) ────

  - type: vertical-stack
