      - type: custom:bubble-card
        card_type: pop-up
        hash: "#snooze_lighting"
        name: Lighting Snoozes
        icon: mdi:lightbulb-auto
      - type: custom:mushroom-title-card
        subtitle: LR motion lights
      - type: horizontal-stack
