          - type: custom:mushroom-template-card
            primary: 30 min
            secondary: >
              {% set ts = state_attr('input_datetime.snooze_lr_motion', 'timestamp') | float(0) %}
              {{ 'until ' ~ (ts | timestamp_custom('%-I:%M %p')) if ts > now().timestamp() else 'active' }}
            icon: mdi:alarm-snooze
            icon_color: >
              {{ 'orange' if state_attr('input_datetime.snooze_lr_motion', 'timestamp') | float(0) > now().timestamp() else 'green' }}
            tap_action:
              action: call-service
              service: script.snooze_automation
              service_data: { snooze_id: lr_motion, duration_minutes: 30 }
          - type: custom:mushroom-template-card
            primary: 2 hrs
            icon: mdi:alarm-snooze
            tap_action:
              action: call-service
              service: script.snooze_automation
